<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="#1a2744" stroke="#fff" stroke-width="4"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="200" cy="200" r="120" fill="#0f1a33" stroke="#fff" stroke-width="3"/>
  <circle cx="200" cy="200" r="90" fill="#1a2744" stroke="#fff" stroke-width="2"/>

  <!-- Crossed hockey sticks / batons -->
  <!-- Left stick -->
  <g transform="rotate(-45, 200, 200)">
    <rect x="80" y="185" width="240" height="30" rx="8" fill="#1a2744" stroke="#fff" stroke-width="2"/>
    <rect x="80" y="185" width="50" height="30" rx="8" fill="#2a3a5c"/>
    <ellipse cx="80" cy="200" rx="20" ry="15" fill="#2a3a5c" stroke="#fff" stroke-width="2"/>
  </g>
  <!-- Right stick -->
  <g transform="rotate(45, 200, 200)">
    <rect x="80" y="185" width="240" height="30" rx="8" fill="#1a2744" stroke="#fff" stroke-width="2"/>
    <rect x="80" y="185" width="50" height="30" rx="8" fill="#2a3a5c"/>
    <ellipse cx="80" cy="200" rx="20" ry="15" fill="#2a3a5c" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Red and white ribbon bands -->
  <rect x="30" y="185" width="340" height="18" rx="4" fill="#cc1a1a" opacity="0.9"/>
  <rect x="30" y="203" width="340" height="14" rx="4" fill="#fff" opacity="0.9"/>
  <rect x="30" y="217" width="340" height="18" rx="4" fill="#1a2744" opacity="0.9"/>

  <!-- Inner dark circle -->
  <circle cx="200" cy="200" r="88" fill="#0f1a33"/>
  <circle cx="200" cy="200" r="85" fill="none" stroke="#fff" stroke-width="2"/>

  <!-- 5 stars pattern (like the image: 2 top, 1 middle, 2 bottom) -->
  <!-- Top left star -->
  <polygon points="155,155 160,170 175,170 163,179 168,194 155,185 142,194 147,179 135,170 150,170"
           fill="#fff"/>
  <!-- Top right star -->
  <polygon points="245,155 250,170 265,170 253,179 258,194 245,185 232,194 237,179 225,170 240,170"
           fill="#fff"/>
  <!-- Middle star (larger) -->
  <polygon points="200,160 207,180 228,180 212,192 218,212 200,200 182,212 188,192 172,180 193,180"
           fill="#fff"/>
  <!-- Bottom left star -->
  <polygon points="163,210 168,225 183,225 171,234 176,249 163,240 150,249 155,234 143,225 158,225"
           fill="#fff"/>
  <!-- Bottom right star -->
  <polygon points="237,210 242,225 257,225 245,234 250,249 237,240 224,249 229,234 217,225 232,225"
           fill="#fff"/>

  <!-- Estd. 2015 text -->
  <text x="200" y="268" text-anchor="middle" font-family="Georgia, serif" font-size="14"
        font-weight="bold" fill="#fff" letter-spacing="1">Estd. 2015</text>

  <!-- SHINING STAR arc text (top) -->
  <path id="topArc" d="M 60,200 A 140,140 0 0,1 340,200" fill="none"/>
  <text font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#1a2744" letter-spacing="3">
    <textPath href="#topArc" startOffset="10%">SHINING STAR</textPath>
  </text>

  <!-- UNITED arc text -->
  <path id="midArc" d="M 90,200 A 110,110 0 0,1 310,200" fill="none"/>
  <text font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#1a2744" letter-spacing="4">
    <textPath href="#midArc" startOffset="18%">· UNITED ·</textPath>
  </text>

  <!-- HAMREN arc text (bottom) -->
  <path id="bottomArc" d="M 55,210 A 145,145 0 0,0 345,210" fill="none"/>
  <text font-family="Arial Black, sans-serif" font-size="24" font-weight="900" fill="#1a2744" letter-spacing="5">
    <textPath href="#bottomArc" startOffset="22%">HAMREN</textPath>
  </text>
</svg>
