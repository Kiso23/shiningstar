<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle for contrast -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.3"/>
  
  <!-- Top text arc -->
  <defs>
    <path id="topArc" d="M 40,100 A 60,60 0 0,1 160,100" fill="none"/>
    <path id="bottomArc" d="M 160,100 A 60,60 0 0,1 40,100" fill="none"/>
  </defs>
  
  <!-- Top text: SHINING STAR UNITED -->
  <text font-size="16" font-weight="bold" letter-spacing="2" fill="#f0f4f0">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      SHINING STAR UNITED
    </textPath>
  </text>
  
  <!-- Main circle -->
  <circle cx="100" cy="100" r="55" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="3"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="48" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Stars inside circle -->
  <!-- Top left star -->
  <g transform="translate(80, 75)">
    <polygon points="0,-8 2.4,-2.4 8,-0.8 3.2,3.2 4.8,9.2 0,5.6 -4.8,9.2 -3.2,3.2 -8,-0.8 -2.4,-2.4" fill="#1a1a1a"/>
  </g>
  
  <!-- Top right star -->
  <g transform="translate(120, 75)">
    <polygon points="0,-8 2.4,-2.4 8,-0.8 3.2,3.2 4.8,9.2 0,5.6 -4.8,9.2 -3.2,3.2 -8,-0.8 -2.4,-2.4" fill="#1a1a1a"/>
  </g>
  
  <!-- Center star -->
  <g transform="translate(100, 95)">
    <polygon points="0,-8 2.4,-2.4 8,-0.8 3.2,3.2 4.8,9.2 0,5.6 -4.8,9.2 -3.2,3.2 -8,-0.8 -2.4,-2.4" fill="#1a1a1a"/>
  </g>
  
  <!-- Bottom left star -->
  <g transform="translate(80, 115)">
    <polygon points="0,-8 2.4,-2.4 8,-0.8 3.2,3.2 4.8,9.2 0,5.6 -4.8,9.2 -3.2,3.2 -8,-0.8 -2.4,-2.4" fill="#1a1a1a"/>
  </g>
  
  <!-- Bottom right star -->
  <g transform="translate(120, 115)">
    <polygon points="0,-8 2.4,-2.4 8,-0.8 3.2,3.2 4.8,9.2 0,5.6 -4.8,9.2 -3.2,3.2 -8,-0.8 -2.4,-2.4" fill="#1a1a1a"/>
  </g>
  
  <!-- Estd. 2015 text -->
  <text x="100" y="135" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Estd. 2015</text>
  
  <!-- Bottom text: HAMREN -->
  <text x="100" y="165" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="middle" fill="#f0f4f0">HAMREN</text>
  
  <!-- Top left boot/shoe -->
  <g transform="translate(35, 60) rotate(-45)">
    <rect x="0" y="0" width="12" height="20" rx="2" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="2" y="8" width="8" height="8" fill="#1a1a1a"/>
  </g>
  
  <!-- Top right boot/shoe -->
  <g transform="translate(165, 60) rotate(45)">
    <rect x="0" y="0" width="12" height="20" rx="2" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="2" y="8" width="8" height="8" fill="#1a1a1a"/>
  </g>
  
  <!-- Bottom left boot/shoe -->
  <g transform="translate(35, 140) rotate(45)">
    <rect x="0" y="0" width="12" height="20" rx="2" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="3" cy="18" r="1.5" fill="#1a1a1a"/>
    <circle cx="9" cy="18" r="1.5" fill="#1a1a1a"/>
  </g>
  
  <!-- Bottom right boot/shoe -->
  <g transform="translate(165, 140) rotate(-45)">
    <rect x="0" y="0" width="12" height="20" rx="2" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="3" cy="18" r="1.5" fill="#1a1a1a"/>
    <circle cx="9" cy="18" r="1.5" fill="#1a1a1a"/>
  </g>
</svg>
